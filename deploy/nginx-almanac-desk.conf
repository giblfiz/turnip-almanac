# Turnip Almanac DESK BRANCH — almanac-desk.implausible.enterprises (deploy/site.sh --install-desk; paired with desk.turnipworks.net)
server {
    listen 80;
    listen [::]:80;
    server_name almanac-desk.implausible.enterprises;
    root /var/www/almanac-desk;
    index index.html;
    # pages and scripts change often: never let a cache hold an old one (scripts also carry ?v=<hash>)
    location ~* \.(html|js|css|json)$ { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
    location /downloads/ { add_header Content-Disposition "attachment"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
