<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turnip Almanac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one infinite canvas. x = time (shelf → campaign → sessions → now), zoom = abstraction. HUD floats over it. */
:root {
  --paper: #fcfbf8;      /* cards, sheets */
  --ground: #efece5;     /* the canvas itself */
  --ink: #1a1917;
  --ink-2: #5f5c55;
  --ink-3: #8e8a80;
  --rule: #ddd8cd;
  --ochre: #a8770f;      /* Turnip Works' accent: links, now line, threads */
  --ochre-soft: #a8770f22;
  --band: #e6e2d8;
  --note: #f6e7a8;
  --note-ink: #3d3420;
  --crease: #e4dfd3;
  --shadow: 0 1px 2px #1a191714, 0 6px 18px #1a19170f;
  --f-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #24231f; --ground: #181715; --ink: #ece9e2; --ink-2: #b4afa4; --ink-3: #7f7a70; --rule: #3a3833;
  --ochre: #e0aa45; --ochre-soft: #e0aa4526; --band: #1f1e1b; --note: #4a4226; --note-ink: #f1e6c0; --crease: #2e2c27;
  --shadow: 0 1px 2px #0006, 0 6px 18px #0005; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #24231f; --ground: #181715; --ink: #ece9e2; --ink-2: #b4afa4; --ink-3: #7f7a70; --rule: #3a3833;
  --ochre: #e0aa45; --ochre-soft: #e0aa4526; --band: #1f1e1b; --note: #4a4226; --note-ink: #f1e6c0; --crease: #2e2c27;
  --shadow: 0 1px 2px #0006, 0 6px 18px #0005; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#vp { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--rule) 1px, transparent 1.2px); }
#vp.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.n { position: absolute; box-sizing: border-box; }
h1, h2, h3, .disp { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
img { max-width: none; }

/* --- semantic zoom: every node is far / mid / near by its size ON SCREEN --- */
/* f = far only, m = mid and near, nr = near only, fm = far and mid. Set per element by JS, so nested zoomable things never inherit their parent's level. */
.lodoff { display: none !important; }

/* zones: big quiet labels you read from far away */
.zone { border-radius: 28px; }
.zone > .zl { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-weight: 700; color: var(--ink-3); opacity: .55; pointer-events: none; }

/* bands: lanes and session columns */
.lane { background: var(--band); border-radius: 18px; }
.lane.alt { background: transparent; }
.col { border-left: 1px dashed var(--rule); }
.colhead { padding: 18px 20px; }
.colhead .num { font: 600 15px var(--f-body); color: var(--ochre); letter-spacing: .08em; text-transform: uppercase; }
.colhead h2 { font-size: 34px; margin-top: 4px; }
.colhead .date { color: var(--ink-2); font-size: 15px; margin-top: 4px; }
.colhead .recap { color: var(--ink-2); font-size: 16px; line-height: 1.45; margin-top: 10px; }
.colhead.prep h2 { font-style: italic; }
.nowline { background: var(--ochre); width: 4px; border-radius: 2px; }
.nowtag { background: var(--ochre); color: var(--paper); font: 700 22px var(--f-display); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
.prepwash { background: linear-gradient(180deg, var(--ochre-soft), transparent 60%); border-radius: 18px; }

/* cards */
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; overflow: hidden; }
.card h3 { font-size: 22px; }
.card .t { color: var(--ink-2); font-size: 15px; line-height: 1.45; margin-top: 6px; }
.fl { font-family: var(--f-display); font-weight: 700; line-height: 1.05; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 6px; background: var(--ochre-soft); color: var(--ochre); font-weight: 600; cursor: pointer; white-space: nowrap; }
.chip:hover { text-decoration: underline; }
.chip img { width: 1.2em; height: 1.2em; }
.chip::after { content: "↗"; font-size: .8em; opacity: .75; }

/* books */
.book { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px 18px 18px 10px; box-shadow: var(--shadow); border-left: 14px solid var(--ochre); }
.book .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; padding: 40px; }
.book .cover img { width: 160px; height: 160px; }
.book .cover .fl { font-size: 54px; overflow-wrap: normal; }
.book .cover .sub { font-size: 30px; color: var(--ink-2); }
.book .bhead { padding: 20px 24px 6px; display: flex; gap: 14px; align-items: center; }
.book .bhead img { width: 44px; height: 44px; }
.book .bhead h2 { font-size: 30px; }
.chap { position: absolute; font: 700 22px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ochre); }
.entry { padding: 10px 12px; border-radius: 10px; }
.entry .fm h3 { font-size: 34px; line-height: 1.05; }
.entry h3 { font-size: 17px; display: flex; align-items: center; gap: 6px; }
.entry h3 img { width: 22px; height: 22px; }
.entry .t { font-size: 12.5px; margin-top: 4px; }
.entry .fl { font-size: 26px; }
.entry .backs { margin-top: 6px; font-size: 11px; color: var(--ink-3); }
.entry .backs .chip { font-size: 11px; }
.hl { outline: 3px solid var(--ochre); outline-offset: 3px; }

/* overmap */
.overmap { background: var(--paper); border: 1px solid var(--rule); border-radius: 22px; box-shadow: var(--shadow);
  background-image: radial-gradient(circle at 70% 30%, var(--ochre-soft), transparent 45%), radial-gradient(circle at 20% 80%, var(--ochre-soft), transparent 40%); background-color: var(--paper); }
.overmap .omh { position: absolute; left: 32px; top: 24px; }
.overmap .omh h2 { font-size: 40px; }
.overmap .omh .t { color: var(--ink-2); font-size: 17px; margin-top: 4px; }
.overmap svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.overmap .road { stroke: var(--ink-3); stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; fill: none; }
.place { width: 200px; height: 150px; margin: -75px 0 0 -100px; text-align: center; border-radius: 16px; padding: 8px; }
.place:hover { background: var(--ochre-soft); }
.place img.pi { width: 72px; height: 72px; }
.place .pn { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.place .fl { font-size: 40px; }
.place .pnote { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
.place .tw { display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 600; color: var(--ochre); text-decoration: none; border: 1px solid var(--ochre); border-radius: 999px; padding: 1px 6px; }
.place .backs { font-size: 9px; color: var(--ink-3); margin-top: 3px; }
.place .backs .chip { font-size: 9px; }

/* the book on the shelf: an index of rules beside the real pages */
.bk { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px 22px 22px 12px; box-shadow: var(--shadow); border-left: 18px solid var(--ochre); }
.bk .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center; padding: 80px; }
.bk .cover .fl { font-size: 190px; }
.bk .cover .sub { font-size: 80px; color: var(--ink-2); }
.bk .cover img { width: 260px; height: 260px; }
.bk .bhead { position: absolute; left: 30px; top: 26px; right: 30px; display: flex; gap: 16px; align-items: center; }
.bk .bhead h2 { font-size: 46px; }
.bk .bhead .t { color: var(--ink-2); font-size: 20px; margin-top: 4px; }
.chap { position: absolute; font: 700 26px var(--f-display); color: var(--ochre); }
.entry { padding: 12px 14px; border-radius: 12px; }
.entry .fm h3 { font-size: 36px; line-height: 1.05; }
.entry h3 { font-size: 19px; }
.entry .t { font-size: 13.5px; margin-top: 4px; line-height: 1.4; }
.entry .pg { margin-top: 6px; font-size: 12px; }
.entry .backs { margin-top: 4px; font-size: 11px; color: var(--ink-3); }
.entry .backs .chip { font-size: 11px; }
.pagef { background: #fff; border: 1px solid var(--rule); box-shadow: var(--shadow); border-radius: 4px; overflow: hidden; }
.pagef .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 120px var(--f-display); color: #c9c3b6; background: repeating-linear-gradient(0deg, #f4f2ec 0 22px, #fff 22px 44px); }
.pagef .ph small { display: block; font: 500 34px var(--f-body); color: #a8a296; text-align: center; }
.pagef .cv { position: absolute; inset: 0; }
.pagef .cv canvas { width: 100%; height: 100%; display: block; }
.pagef .pnum { position: absolute; right: -2px; bottom: -40px; font: 600 22px var(--f-body); color: var(--ink-3); }
.region { position: absolute; border-radius: 4px; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .3s, background .3s; }
.region:hover { box-shadow: inset 0 0 0 2px #a8770f88; background: #a8770f10; }
.region.hl { outline: none; box-shadow: inset 0 0 0 4px #a8770f; background: #a8770f22; }
.region .rt { position: absolute; left: 0; top: -22px; font: 600 13px var(--f-body); color: #7a5608; background: #fff8e6; border: 1px solid #a8770f66; border-radius: 6px 6px 0 0; padding: 1px 7px; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; }
.region:hover .rt, .region.hl .rt { opacity: 1; }

/* builder: a region ON the sheet; zoom in, then scroll down through the steps */
.builder { position: absolute; right: 16px; top: 16px; width: 240px; border: 2px dashed var(--ochre); border-radius: 14px; overflow: hidden; background: var(--ochre-soft); }
.builder .bf { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 120px; text-align: center; gap: 14px; color: var(--ochre); }
.builder .bf .fl { font-size: 46px; }
.builder .bf .t { font-size: 17px; color: var(--ink-2); padding: 0 16px; }
.binner { position: absolute; left: 0; top: 0; width: 960px; transform-origin: 0 0; transform: scale(.25); padding: 30px; box-sizing: border-box; font-size: 22px; }
.bstep { border-radius: 22px; padding: 22px 26px; margin-bottom: 30px; background: var(--paper); border: 1px solid var(--rule); }
.bstep .q { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.bstep .q .no { font: 700 30px var(--f-display); color: var(--ochre); }
.bstep .q h3 { font-size: 36px; }
.bstep .q .sub { margin-left: auto; font-size: 20px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bstep .q .chip { font-size: 18px; }
.bstep .hint { color: var(--ink-2); font-size: 21px; margin: 8px 0 16px; line-height: 1.4; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opts.three { grid-template-columns: 1fr 1fr 1fr; }
.opt { border: 2px solid var(--rule); border-radius: 16px; padding: 14px 16px; text-align: left; background: transparent; cursor: pointer; color: var(--ink); }
.opt b { font: 700 26px var(--f-display); display: flex; justify-content: space-between; gap: 8px; }
.opt b em { font: 600 20px var(--f-body); font-style: normal; color: var(--ochre); }
.opt span { font-size: 18px; color: var(--ink-2); display: block; margin-top: 4px; line-height: 1.35; }
.opt.sel { border-color: var(--ochre); background: var(--ochre-soft); }
.opt:disabled { opacity: .4; cursor: not-allowed; }
.rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.rows.one { grid-template-columns: 1fr; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--rule); border-radius: 14px; padding: 10px 12px; }
.row.on { border-color: var(--ochre); background: var(--ochre-soft); }
.row b { font: 600 22px var(--f-body); display: block; }
.row span { font-size: 17px; color: var(--ink-2); display: block; line-height: 1.3; }
.row .cost { font-size: 17px; color: var(--ochre); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--rule); background: var(--paper); font: 700 26px var(--f-body); cursor: pointer; color: var(--ink); padding: 0; }
.stepper button:hover:not(:disabled) { border-color: var(--ochre); color: var(--ochre); }
.stepper button:disabled { opacity: .3; cursor: not-allowed; }
.stepper output { min-width: 40px; text-align: center; font: 700 30px var(--f-display); font-variant-numeric: tabular-nums; }
.grouph { font: 700 24px var(--f-display); margin: 14px 0 8px; display: flex; justify-content: space-between; color: var(--ink-2); }
.seg { display: flex; border: 2px solid var(--rule); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 12px; font: 600 17px var(--f-body); cursor: pointer; color: var(--ink-2); border-left: 1px solid var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button.sel { background: var(--ochre); color: var(--paper); }
.chipgrid { display: grid; grid-template-columns: 150px repeat(4, 1fr); gap: 8px; font-size: 18px; align-items: stretch; }
.chipgrid .h { font-weight: 600; color: var(--ink-2); align-self: end; }
.chipgrid button { border: 2px solid var(--rule); border-radius: 12px; background: transparent; padding: 8px; font: 600 18px var(--f-body); cursor: pointer; color: var(--ink); }
.chipgrid button span { display: block; font-weight: 500; font-size: 15px; color: var(--ochre); }
.chipgrid button.sel { border-color: var(--ochre); background: var(--ochre-soft); }
.bstep input, .bstep select { width: 100%; box-sizing: border-box; font: 600 30px var(--f-display); padding: 12px 14px; border: 2px solid var(--rule); border-radius: 14px; background: var(--paper); color: var(--ink); }
.bstep select { font: 500 22px var(--f-body); width: auto; }
.crease { border-radius: 18px; background: repeating-linear-gradient(135deg, var(--crease) 0 12px, transparent 12px 24px); border: 2px dashed var(--ink-3); display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink-2); font-size: 24px; padding: 20px; box-sizing: border-box; }
.interp { font-size: 18px; color: var(--ink-2); border-left: 4px solid var(--ochre); padding: 6px 12px; margin-top: 10px; line-height: 1.4; }
.bpts { position: absolute; left: 30px; right: 30px; top: 0; }
/* headline labels: big text laid over a region; JS fades them once they outgrow the screen */
.lbl { position: absolute; font-family: var(--f-display); font-weight: 700; line-height: 1; color: var(--ink); white-space: nowrap; pointer-events: none; letter-spacing: -0.01em; z-index: 3; }
.lbl.onmap { color: #2b2a26; text-shadow: 0 0 30px #f3efe6, 0 0 12px #f3efe6; }
.lbl.pnumlbl { color: #a8770f; }
.lbl.blbl { left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; color: var(--ochre); }

/* the map */
.map { background: #e9e4d8; border-radius: 30px; overflow: hidden; box-shadow: var(--shadow); }
.mapimg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .attrib { font: 500 44px var(--f-body); color: #5f5c55; text-align: right; background: #f3efe6cc; border-radius: 10px; padding: 14px 18px; box-sizing: border-box; }
.place { text-align: center; border-radius: 28px; padding: 14px; box-sizing: border-box; margin: 0; width: 340px; height: auto; z-index: 2; }
.place:hover { background: #a8770f1f; }
.place img.pi { width: 200px; height: 200px; filter: drop-shadow(0 6px 10px #0004); }
.place .pn { font: 700 58px var(--f-display); line-height: 1.02; color: #1a1917; background: #fcfbf8ee; border-radius: 14px; padding: 4px 12px; display: inline-block; margin-top: 4px; }
.place .pnote { font-size: 28px; color: #3d3b36; margin-top: 8px; background: #fcfbf8dd; border-radius: 10px; padding: 4px 10px; }
.place .tw { display: inline-block; margin-top: 10px; font-size: 24px; font-weight: 600; color: #7a5608; text-decoration: none; border: 2px solid #a8770f; border-radius: 999px; padding: 4px 14px; background: #fcfbf8; }
.place .backs { font-size: 24px; color: #5f5c55; margin-top: 6px; }
.place .backs .chip { font-size: 24px; }

/* the book: no cover swap; a header, an index, the pages */
.bk .bhead { position: absolute; left: 40px; top: 40px; right: 40px; display: flex; gap: 24px; align-items: center; }
.bk .bhead img { width: 130px; height: 130px; }
.bk .bhead h2 { font-size: 96px; }
.bk .bhead .t { font-size: 34px; }
.chap { font-size: 32px; }
.entry h3 { font-size: 23px; line-height: 1.1; }
.entry .t { font-size: 14px; }
.entry .pg { margin-top: 6px; font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pagef .ph { font-size: 200px; }
.interpcard h3 { font-size: 40px; }
.interpcard .t { font-size: 24px; line-height: 1.5; }

/* launcher and empty seats */
.launch { display: flex; }
.launchbtn { flex: 1; display: flex; align-items: center; gap: 60px; padding: 0 90px; border: 6px dashed var(--ochre); border-radius: 48px; background: var(--ochre-soft); color: var(--ink); cursor: pointer; text-align: left; }
.launchbtn:hover { background: color-mix(in srgb, var(--ochre) 22%, transparent); }
.launchbtn .plus { font: 700 300px/1 var(--f-display); color: var(--ochre); }
.launchbtn b { display: block; font: 700 190px/1 var(--f-display); }
.launchbtn small { display: block; font-size: 52px; color: var(--ink-2); margin-top: 24px; }
.seat { display: flex; }
.seatbtn { flex: 1; border: 4px dashed var(--rule); border-radius: 30px; background: transparent; color: var(--ink-3); font: 600 90px var(--f-display); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 30px; }
.seatbtn:hover { border-color: var(--ochre); color: var(--ochre); }
.seatbtn .plus { font-size: 160px; }

/* session headers */
.colhead { padding: 30px 34px; }
.colhead .snum { font: 700 200px/0.9 var(--f-display); color: var(--ochre); }
.colhead h2 { font-size: 60px; margin-top: 12px; }
.colhead .date { font-size: 28px; color: var(--ink-2); margin-top: 8px; }
.colhead .recap { font-size: 26px; color: var(--ink-2); line-height: 1.4; margin-top: 14px; }
.colhead.prep h2 { font-style: italic; }
.nowtag { font-size: 44px; padding: 10px 26px; }
.cnote { font-size: 24px; padding: 18px 22px; }
.adv .lvl { font-size: 18px; } .adv .what { font-size: 30px; } .adv .why { font-size: 20px; }
.lanehead { padding: 30px 36px; }
.lanehead img { width: 150px; height: 150px; float: right; }
.lanehead .num { font: 600 22px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ochre); }
.lanehead h2 { font-size: 90px; margin-top: 6px; }
.lanehead .t { font-size: 30px; color: var(--ink-2); margin-top: 12px; line-height: 1.4; }
.inbox .ih { padding: 30px; font-size: 28px; }
.inbox h2 { font-size: 70px; }
.loose { width: 330px; min-height: 180px; }
.loose .body { font-size: 22px; }

/* sheets: wide rows, everything always drawn */
.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 28px; box-shadow: var(--shadow); }
.sheet .main { position: absolute; inset: 0; }
.sheet section { position: absolute; top: 30px; bottom: 30px; display: flex; flex-direction: column; gap: 14px; }
.sheet .sA { left: 34px; width: 640px; }
.sheet .sB { left: 710px; width: 1040px; }
.sheet .sC { left: 1786px; width: 620px; }
.sheet h4 { font: 700 40px var(--f-display); margin: 0; display: flex; gap: 12px; align-items: center; }
.sheet h4 .chip { font: 600 16px var(--f-body); }
.sheet .nm { font-size: 130px; line-height: .95; }
.sheet .nm.empty { color: var(--ink-3); font-style: italic; }
.sheet .who { color: var(--ink-2); font-size: 26px; }
.budget { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.budget > div { border: 1px solid var(--rule); border-radius: 14px; padding: 8px 12px; }
.budget .k, .sk .k, .der .k, .track .k { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.budget .bv { font: 700 30px var(--f-display); font-variant-numeric: tabular-nums; }
.budget .bar { height: 6px; border-radius: 3px; background: var(--rule); margin-top: 6px; overflow: hidden; }
.budget .bar i { display: block; height: 100%; background: var(--ochre); }
.budget .over .bar i { background: #b3412c; }
.asof { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 14px; color: var(--ink-3); }
.asof button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 14px; cursor: pointer; color: var(--ink-2); }
.asof button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.asof button.has { border-color: var(--ochre); }
.warn { border: 1px solid #b3412c; color: #b3412c; border-radius: 12px; padding: 8px 12px; font-size: 15px; line-height: 1.45; }
.sec { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.sec .chip { font-size: 12px; letter-spacing: 0; text-transform: none; }
.ledger { font-size: 14px; columns: 2; column-gap: 22px; }
.ledger div { display: flex; justify-content: space-between; gap: 8px; break-inside: avoid; padding: 1px 0; border-bottom: 1px dotted var(--rule); }
.ledger span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.pinbtn { position: absolute; right: 0; top: 0; border: 0; background: transparent; cursor: pointer; font-size: 30px; color: var(--ink-3); }
.pinbtn.on { color: var(--ochre); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.acol { border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.ahead { background: var(--band); padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
.ahead .an { font: 700 24px var(--f-display); }
.pv { font: 700 44px var(--f-display); line-height: 1; font-variant-numeric: tabular-nums; cursor: help; border-radius: 6px; padding: 0 4px; }
.pv.mid { font-size: 38px; }
.pv:hover, .pv.pinned { background: var(--ochre-soft); color: var(--ochre); }
.pv.changed { animation: bump .6s ease-out; }
@keyframes bump { 0% { color: var(--ochre); transform: scale(1.25); } 100% { transform: none; } }
.tn { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sk { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--rule); }
.sk .k { text-transform: none; letter-spacing: 0; font-size: 21px; color: var(--ink); }
.sk.zero .k, .sk.zero .pv { color: var(--ink-3); }
.die { border: 1px solid var(--rule); background: transparent; border-radius: 10px; width: 40px; height: 40px; cursor: pointer; font-size: 20px; padding: 0; color: var(--ink-2); }
.die.wide { width: auto; padding: 0 14px; font-size: 16px; margin-left: auto; }
.die:hover { border-color: var(--ochre); color: var(--ochre); }
.der { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.der > div { border: 1px solid var(--rule); border-radius: 14px; padding: 8px 10px; text-align: center; }
.der small { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.track { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.track .k { margin-right: 8px; display: flex; gap: 6px; align-items: center; }
.track button { width: 38px; height: 38px; border-radius: 9px; border: 2px solid var(--ink-2); background: transparent; cursor: pointer; font: 700 15px var(--f-body); color: #fff; padding: 0; }
.track button.B { background: #c98a1b; border-color: #c98a1b; }
.track button.L { background: #b3412c; border-color: #b3412c; }
.track .wound { font-size: 15px; color: #b3412c; font-weight: 600; margin-left: 6px; }
.rolls { display: flex; flex-direction: column; gap: 6px; }
.rolls .none, .list .none { color: var(--ink-3); font-size: 15px; }
.roll { border: 1px solid var(--rule); border-radius: 10px; padding: 7px 10px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--paper); }
.roll b { font-weight: 600; }
.roll .dd { display: flex; gap: 3px; flex-wrap: wrap; }
.roll .dd i { font-style: normal; min-width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--rule); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-variant-numeric: tabular-nums; padding: 0 3px; }
.roll .dd i.ok { background: var(--ochre); color: var(--paper); border-color: var(--ochre); }
.roll .verdict { margin-left: auto; font-weight: 600; color: var(--ochre); }
.roll .verdict.fail { color: var(--ink-3); }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; }
.list { display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.3; }
.list b { font-weight: 600; }
.list .e { color: var(--ink-2); }

/* builder: fixed columns of steps on the sheet, under one big heading */
.builder { position: absolute; border: 3px dashed var(--ochre); border-radius: 22px; overflow: hidden; background: color-mix(in srgb, var(--ochre) 6%, var(--paper)); }
.binner { position: absolute; left: 0; top: 0; width: 4600px; height: 3400px; transform-origin: 0 0; font-size: 22px; }
.bcol { position: absolute; top: 30px; }
/* notes in cells, advancement cards, loose notes */
.cellnotes { display: flex; flex-direction: column; gap: 14px; }
.cnote { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; font-size: 17px; line-height: 1.45; box-shadow: var(--shadow); }
.cnote.idea { background: transparent; border-style: dashed; font-style: italic; color: var(--ink-2); box-shadow: none; }
.adv { border: 2px solid var(--ochre); }
.adv .lvl { font: 700 13px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ochre); }
.adv .what { font: 700 22px var(--f-display); margin-top: 2px; }
.adv .why { color: var(--ink-2); font-size: 15px; }
.lanehead { padding: 22px; }
.lanehead h2 { font-size: 34px; }
.lanehead .t { color: var(--ink-2); font-size: 16px; margin-top: 6px; line-height: 1.4; }
.lanehead img { width: 64px; height: 64px; float: right; }
.lanehead .fl { font-size: 54px; }
.loose { background: var(--note); color: var(--note-ink); border-radius: 4px 4px 12px 4px; box-shadow: var(--shadow); width: 220px; min-height: 120px; }
.loose .grip { height: 22px; cursor: move; border-bottom: 1px solid #0001; display: flex; justify-content: flex-end; }
.loose .grip button { border: 0; background: transparent; cursor: pointer; color: inherit; opacity: .5; font-size: 14px; }
.loose .body { padding: 10px 12px; font-size: 16px; line-height: 1.4; outline: none; min-height: 80px; }
.inbox { background: transparent; border: 2px dashed var(--ink-3); border-radius: 18px; }
.inbox .ih { padding: 16px 20px; color: var(--ink-2); }
.inbox h2 { font-size: 28px; color: var(--ink); }

/* --- HUD --- */
#threads { position: fixed; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
#threads path { fill: none; stroke: var(--ochre); stroke-width: 2.2; }
#threads circle { fill: var(--ochre); }
.tend { position: fixed; z-index: 6; transform: translate(-50%, -50%); background: var(--ochre); color: var(--paper); font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); }
#rulerT { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 0; z-index: 4; pointer-events: none; }
#rulerL { position: fixed; top: 0; bottom: 0; left: 0; width: 0; z-index: 4; pointer-events: none; }
.rl { position: absolute; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--ink-2); background: color-mix(in srgb, var(--paper) 88%, transparent); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px; transform: translateX(-50%); top: 10px; }
.rl.now { color: var(--paper); background: var(--ochre); border-color: var(--ochre); }
#rulerL .rl { transform: translateY(-50%); left: max(10px, env(safe-area-inset-left, 0px)); top: auto; writing-mode: vertical-rl; rotate: 180deg; padding: 9px 3px; }
.arrow { position: fixed; z-index: 7; display: flex; align-items: center; gap: 8px; transform: translate(-50%, -50%); background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow); border-radius: 999px; padding: 5px 12px 5px 5px; cursor: pointer; font-weight: 600; font-size: 13px; transition: opacity .25s; white-space: nowrap; }
.arrow img { width: 30px; height: 30px; }
.arrow .dir { color: var(--ochre); font-size: 18px; display: inline-block; }
.arrow:hover { border-color: var(--ochre); }
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 8; display: flex; gap: 4px; align-items: center; background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: 5px; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
#bar button { border: 0; background: transparent; border-radius: 11px; padding: 7px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--ink); }
#bar button:hover { background: var(--ochre-soft); }
#bar button:focus-visible, .arrow:focus-visible, .opt:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
#bar button:disabled { opacity: .35; }
#bar img { width: 20px; height: 20px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--rule); margin: 4px 2px; }
#bar kbd { font: 11px var(--f-body); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
#title { position: fixed; z-index: 8; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 8px 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
#title .disp { font-size: 20px; }
#title .disp span { color: var(--ochre); }
#title .sub { font-size: 12px; color: var(--ink-2); }
#help { position: fixed; z-index: 8; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.6; color: var(--ink-2); max-width: 270px; }
#help b { color: var(--ink); font-weight: 600; }
#help button { border: 0; background: transparent; cursor: pointer; float: right; color: var(--ink-3); }
#helpQ { position: fixed; z-index: 8; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper); box-shadow: var(--shadow); cursor: pointer; font: 600 16px var(--f-body); color: var(--ink-2); }
#pal { position: fixed; inset: 0; z-index: 20; background: #0003; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0; }
#pal .box { width: min(560px, 100%); background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--rule); overflow: hidden; }
#pal input { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--rule); padding: 16px 18px; font: 500 18px var(--f-body); background: transparent; color: var(--ink); outline: none; }
#pal ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
#pal li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
#pal li.on { background: var(--ochre-soft); }
#pal li img { width: 26px; height: 26px; }
#pal li .k { margin-left: auto; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
@media (max-width: 640px) { #help { display: none; } #bar .lbl { display: none; } }
@media (prefers-reduced-motion: reduce) { .v.changed { animation: none; } .arrow { transition: none; } }
/* v4: golden-ish sheet (2100 × 1300), two bands; builder is a small box in the bottom-left corner */
.sheet section { position: absolute; display: flex; flex-direction: column; gap: 12px; }
.sheet .sA { left: 34px; top: 30px; width: 600px; height: 520px; }
.sheet .sB { left: 664px; top: 30px; width: 1040px; height: 520px; }
.sheet .sP { left: 1734px; top: 30px; width: 336px; height: 520px; }
.sheet .sD { left: 34px; top: 580px; width: 1040px; height: 340px; }
.sheet .sL { left: 500px; top: 950px; width: 574px; height: 320px; overflow: hidden; }
.sheet .sC { left: 1104px; top: 580px; width: 966px; height: 690px; overflow: hidden; }
.sheet .nm { font-size: 104px; }
.sheet .who { font-size: 24px; }
.sheet .sk .k { font-size: 22px; }
.sheet .list { font-size: 16px; }
.portrait { position: relative; width: 336px; height: 400px; border-radius: 20px; overflow: hidden; background: var(--band); border: 2px solid var(--rule); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .drophint { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px; font-size: 15px; text-align: center; color: #fff; background: linear-gradient(transparent, #0008); opacity: 0; transition: opacity .2s; }
.portrait:hover .drophint, .portrait.dropping .drophint { opacity: 1; }
.portrait.dropping, .pport.dropping { outline: 4px dashed var(--ochre); outline-offset: 4px; }
.tokens { display: flex; gap: 8px; align-items: center; }
.tokens button, .tokens .upl { width: 66px; height: 66px; border-radius: 12px; border: 2px solid var(--rule); background: var(--band); padding: 0; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--ink-2); box-sizing: border-box; }
.tokens button img { width: 100%; height: 100%; object-fit: cover; }
.tokens button.sel { border-color: var(--ochre); }
.tokens .upl:hover, .tokens button:hover { border-color: var(--ochre); }
.builder { border-width: 3px; }
.builder.todo { border-color: #b3412c; }
.builder.active { box-shadow: 0 0 0 6px var(--ochre-soft); border-style: solid; }
.lbl.blbl { line-height: .95; }
.donebox { border-radius: 16px; padding: 16px 18px; font-size: 20px; line-height: 1.45; margin: 12px 0; border: 2px solid; }
.donebox b { display: block; font: 700 28px var(--f-display); margin-bottom: 4px; }
.donebox.ok { border-color: #3f7d3a; background: #3f7d3a14; }
.donebox.bad { border-color: #b3412c; background: #b3412c12; }
.donebox .w { color: #b3412c; }
.donebtn { width: 100%; }
#threads path.build { stroke-dasharray: 10 6; stroke-width: 3; }
.tend.build { background: var(--ink); }

/* sessions as compact cards */
.scard { padding: 30px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
.scard .shead { display: flex; gap: 22px; align-items: center; }
.scard .snum { font: 700 150px/0.85 var(--f-display); color: var(--ochre); }
.scard h2 { font-size: 52px; }
.scard .date { font-size: 24px; color: var(--ink-2); margin-top: 4px; }
.scard .recap { font-size: 26px; color: var(--ink-2); line-height: 1.4; }
.scard.prep { background: color-mix(in srgb, var(--ochre) 7%, var(--paper)); border-style: dashed; }
.scard .nowtag { margin-left: auto; align-self: flex-start; }
.sgroups { display: flex; flex-direction: column; gap: 14px; }
.sgroup { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.sgh { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.sgh img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: var(--band); }
.sgh b { font: 700 28px var(--f-display); }
.sgh:hover b { color: var(--ochre); }
.tdot { width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--ochre-soft); color: var(--ochre); font: 700 28px var(--f-display); flex: none; }
.tdot.big { width: 130px; height: 130px; font-size: 70px; }
.snote { font-size: 22px; line-height: 1.45; padding-left: 64px; }
.snote.idea { font-style: italic; color: var(--ink-2); }
.snote.karma .kk { font: 700 15px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ochre); border: 2px solid var(--ochre); border-radius: 8px; padding: 1px 8px; }
.snote.karma b { font-weight: 700; }
.snote.karma .e { color: var(--ink-2); font-size: 19px; }
.pcard { padding: 28px 30px; box-sizing: border-box; }
.pcard .pch { display: flex; gap: 22px; align-items: flex-start; }
.pport { width: 130px; height: 130px; border-radius: 18px; overflow: hidden; flex: none; background: var(--band); }
.pport img { width: 100%; height: 100%; object-fit: cover; }
.pcard .num { font: 600 18px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ochre); }
.pcard h2 { font-size: 54px; }
.pcard .t { font-size: 24px; color: var(--ink-2); margin-top: 8px; line-height: 1.4; }
.pcard .backs { margin-top: 14px; font-size: 20px; color: var(--ink-3); }
.pcard .backs .chip { font-size: 20px; }
.inbox .ih { font-size: 28px; padding: 30px; }
.inbox h2 { font-size: 64px; }

/* at the table: on the canvas */
.tablecard { padding: 34px 38px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; }
.tablecard h3 { font-size: 56px; display: flex; gap: 14px; align-items: center; }
.tablecard h3 .chip { font: 600 20px var(--f-body); }
.tablecard > .t { font-size: 22px; color: var(--ink-2); }
.tablecard .rmeta { display: flex; gap: 12px; align-items: center; font-size: 24px; color: var(--ink-2); }
.tb { border: 2px solid var(--ochre); color: var(--ochre); background: transparent; border-radius: 999px; padding: 6px 18px; font: 600 20px var(--f-body); cursor: pointer; }
.tb:hover { background: var(--ochre-soft); }
.tablecard .init { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.tablecard .init li { display: grid; grid-template-columns: 64px 1fr auto; grid-template-areas: "p n d" "p m w"; gap: 2px 14px; align-items: center; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 14px; }
.tablecard .init li.on { border: 3px solid var(--ochre); background: var(--ochre-soft); }
.tablecard .init img { grid-area: p; width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
.tablecard .init .who2 { grid-area: n; font: 700 30px var(--f-display); cursor: pointer; }
.tablecard .init .nums { grid-area: m; font-size: 18px; color: var(--ink-2); }
.tablecard .init .dots { grid-area: d; display: flex; gap: 4px; }
.tablecard .init .dots i { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--ink-3); }
.tablecard .init .dots i.B { background: #c98a1b; border-color: #c98a1b; } .tablecard .init .dots i.L { background: #b3412c; border-color: #b3412c; }
.tablecard .init .wtn { grid-area: w; color: #b3412c; font-weight: 600; font-size: 18px; justify-self: end; }
.tablecard .qdice { display: flex; gap: 24px; align-items: center; font-size: 24px; flex-wrap: wrap; }
.tablecard .qdice label { display: flex; gap: 10px; align-items: center; }
.tablecard .rolls .roll { font-size: 18px; }
.helpcard { padding: 34px 38px; box-sizing: border-box; }
.helpcard h3 { font-size: 56px; }
.helpcard .t { font-size: 25px; line-height: 1.75; color: var(--ink-2); margin-top: 12px; }
.helpcard b { color: var(--ink); }
.artcard { background: var(--paper); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.artcard .grip { height: 26px; cursor: move; display: flex; justify-content: flex-end; background: var(--band); }
.artcard .grip button { border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.artcard img { display: block; width: 100%; }
#world img { -webkit-user-drag: none; user-select: none; }
#world { user-select: none; -webkit-user-select: none; }
#world input, #world textarea, #world [contenteditable] { user-select: text; -webkit-user-select: text; }

/* the quickbar: one line of text, top centre, like Turnip Works */
#qbar { position: fixed; z-index: 12; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); display: flex; align-items: flex-start; gap: 8px; min-height: 40px; padding: 0 12px; background: color-mix(in srgb, var(--paper) 92%, transparent); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(10px); box-sizing: border-box; transition: width .15s ease; }
#qbar.open { width: min(680px, calc(100% - 24px)); }
#qbar .lead { width: 16px; height: 16px; margin-top: 12px; opacity: .55; color: var(--ink); flex: none; }
#qbar textarea { flex: 1; min-width: 0; height: 20px; margin: 0; padding: 10px 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 14px/20px var(--f-body); resize: none; overflow: hidden; box-sizing: content-box; }
#qbar textarea::placeholder { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#qbar kbd { margin-top: 10px; font: 11px var(--f-body); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }
#qbar.open kbd { display: none; }
#qres { position: fixed; z-index: 12; top: calc(58px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(680px, calc(100% - 24px)); max-height: 60vh; overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; box-sizing: border-box; }
.qsec { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 8px 10px 4px; }
.qrow { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.qrow.on { background: var(--ochre-soft); }
.qrow img { width: 24px; height: 24px; border-radius: 5px; object-fit: cover; }
.qrow .qdot { width: 24px; height: 24px; border-radius: 6px; background: var(--ochre-soft); flex: none; }
.qrow small { color: var(--ink-3); }
